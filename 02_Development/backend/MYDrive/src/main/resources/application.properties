
spring.application.name=MYDrive

spring.datasource.url=jdbc:mysql://localhost:3306/mydrivedb
spring.datasource.password=root
spring.datasource.username=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
server.port=8083

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true

app.jwt.secret=CHANGE_ME_TO_A_LONG_RANDOM_SECRET_AT_LEAST_32_CHARS
app.jwt.expiration-ms=3600000

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your_email@gmail.com
spring.mail.password=YOUR_APP_PASSWORD
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.task.scheduling.enabled=true

# File upload limits (defaults are only 1MB file / 10MB request)
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

server.error.include-message=always
server.error.include-binding-errors=always


# File storage backend: "local" (disk, default) or "fileserver" (Go microservice)
app.storage.backend=local
# Directory used by the local backend (physical files on disk)
app.storage.path=/home/slavi/uni/diplomna/MyDrive/storage
# Go file-server (used only when app.storage.backend=fileserver)
app.storage.fileserver.url=http://localhost:9000
app.storage.fileserver.token=

# OpenAI (support chatbot) – provide the key via the OPENAI_API_KEY env var
openai.api.key=${OPENAI_API_KEY:}

# eIDAS / PAdES signing – demo self-signed keystore (auto-generated on first run)
app.signing.keystore-path=/home/slavi/uni/diplomna/MyDrive/signing/mydrive-demo.p12
app.signing.keystore-password=mydrive-demo-pass
app.signing.key-alias=mydrive-signing
